<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/synq-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synq — Runtime for Real-Time AI Participation</title>
    <script>
      (function () {
        try {
          var previous = localStorage.getItem("voxa-theme");
          if (localStorage.getItem("synq-theme") === null && previous !== null) localStorage.setItem("synq-theme", previous);
          if (previous !== null) localStorage.removeItem("voxa-theme");
          var theme = localStorage.getItem("synq-theme") === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body class="synq-app">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
