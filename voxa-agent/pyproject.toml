[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxa-agent"
version = "0.1.0"
description = "LiveKit Agent workers for Voxa AI participants."
requires-python = ">=3.10,<3.15"
dependencies = [
  "livekit-agents~=1.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
voice = [
  "livekit-agents[openai,silero,turn-detector]~=1.5",
]
dev = [
  "ruff>=0.8",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
